name: FTC News Daily Push

on:
  schedule:
    # 表达式说明：
    # 周一到周五，美东时间早上 08:01。
    # 考虑 GitHub 使用 UTC 时间：
    # - 美东夏令时 (EDT, UTC-4) 08:01 对应 UTC 时间 12:01 -> 1 12 * * 1-5
    # - 美东冬令时 (EST, UTC-5) 08:01 对应 UTC 时间 13:01 -> 1 13 * * 1-5
    # 为了保证全年基本在 8:01 左右触发，建议采用夏令时对应的时间 (12:01 UTC) 或冬令时 (13:01 UTC)。
    # 这里设置为 12:01 UTC (即美东夏令时 8:01 / 冬令时 9:01)：
    - cron: '1 12 * * 1-5'
    
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击按钮立即测试

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
